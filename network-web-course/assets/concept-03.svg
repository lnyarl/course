<svg xmlns="http://www.w3.org/2000/svg" width="930" height="230" viewBox="0 0 930 230" role="img" aria-labelledby="t"><title id="t">주소 변경과 캐시 수명</title><rect width="930" height="230" fill="#122b31" rx="12"/><g font-family="sans-serif"><text x="24" y="35" font-size="18" fill="#a0e6c8">주소 변경과 캐시 수명</text><path d="M298 117h30" stroke="#8bd7b6" stroke-width="2" fill="none"/><rect x="22" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="40" y="93" font-size="18" fill="#e6f0ec">t=0 · v1 저장</text><text x="40" y="124" font-size="16" fill="#9be3c3">TTL 60초 시작</text><text x="40" y="153" font-size="14" fill="#c4d9d1">이 리졸버의 응답 보관</text><path d="M604 117h30" stroke="#8bd7b6" stroke-width="2" fill="none"/><rect x="328" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="346" y="93" font-size="18" fill="#e6f0ec">t=30 · 원본 v2</text><text x="346" y="124" font-size="16" fill="#9be3c3">기존 캐시는 v1</text><text x="346" y="153" font-size="14" fill="#c4d9d1">원본 변경 ≠ 캐시 삭제</text><rect x="634" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="652" y="93" font-size="18" fill="#e6f0ec">t=60 · 재조회</text><text x="652" y="124" font-size="16" fill="#9be3c3">만료 후 새 결과 획득</text><text x="652" y="153" font-size="14" fill="#c4d9d1">기존 연결 수명은 별도</text></g></svg>