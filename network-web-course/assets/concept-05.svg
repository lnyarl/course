<svg xmlns="http://www.w3.org/2000/svg" width="930" height="230" viewBox="0 0 930 230" role="img" aria-labelledby="t"><title id="t">재사용과 재검증의 차이</title><rect width="930" height="230" fill="#122b31" rx="12"/><g font-family="sans-serif"><text x="24" y="35" font-size="18" fill="#a0e6c8">재사용과 재검증의 차이</text><path d="M298 117h30" stroke="#8bd7b6" stroke-width="2" fill="none"/><rect x="22" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="40" y="93" font-size="18" fill="#e6f0ec">Fresh</text><text x="40" y="124" font-size="16" fill="#9be3c3">저장 응답 바로 사용</text><text x="40" y="153" font-size="14" fill="#c4d9d1">원본 왕복 생략 가능</text><path d="M604 117h30" stroke="#8bd7b6" stroke-width="2" fill="none"/><rect x="328" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="346" y="93" font-size="18" fill="#e6f0ec">Stale + unchanged</text><text x="346" y="124" font-size="16" fill="#9be3c3">조건부 요청 → 304</text><text x="346" y="153" font-size="14" fill="#c4d9d1">저장된 본문 재사용</text><rect x="634" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="652" y="93" font-size="18" fill="#e6f0ec">Stale + changed</text><text x="652" y="124" font-size="16" fill="#9be3c3">조건부 요청 → 200</text><text x="652" y="153" font-size="14" fill="#c4d9d1">새 본문으로 교체</text></g></svg>