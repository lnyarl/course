<svg xmlns="http://www.w3.org/2000/svg" width="380" height="740" viewBox="0 0 380 740" role="img" aria-labelledby="t d"><title id="t">요청의 단계와 별도 연결</title><desc id="d">DNS는 브라우저에 주소를 알려준다. 브라우저와 프록시는 TLS 연결을, 프록시와 앱은 별도 연결을 사용한다.</desc><rect width="380" height="740" rx="12" fill="#122b31"/><g font-family="sans-serif"><text x="24" y="36" font-size="16" fill="#9be3c3">ONE REQUEST · MANY BOUNDARIES</text><g fill="#1d4247" stroke="#618787"><rect x="30" y="70" width="320" height="90" rx="10"/><rect x="30" y="220" width="320" height="90" rx="10"/><rect x="30" y="410" width="320" height="90" rx="10"/><rect x="30" y="600" width="320" height="90" rx="10"/></g><g text-anchor="middle" fill="#e3eeea" font-size="21"><text x="190" y="108">DNS resolver</text><text x="190" y="257">Browser</text><text x="190" y="447">CDN / Proxy</text><text x="190" y="637">Application</text></g><g text-anchor="middle" fill="#bad3cb" font-size="15"><text x="190" y="139">이름에서 주소를 찾는 별도 경로</text><text x="190" y="288">origin · cookies · CORS</text><text x="190" y="478">캐시 · 라우팅 · TLS 종료</text><text x="190" y="668">API · 앱 · 업스트림 처리</text></g><g stroke="#8ee0bf" stroke-width="2" fill="none"><path d="M190 160v60" stroke-dasharray="7 6"/><path d="M190 310v100M190 500v100"/></g><g fill="#9be3c3" font-size="15"><text x="207" y="196">주소 결과</text><text x="45" y="351">TLS 연결 A</text><text x="45" y="378">암호화된 HTTP</text><text x="45" y="541">별도 연결 B</text><text x="45" y="568">HTTP 또는 HTTPS</text></g><text x="24" y="719" fill="#bad3cb" font-size="14">DNS는 웹 본문을 중계하지 않습니다.</text></g></svg>
