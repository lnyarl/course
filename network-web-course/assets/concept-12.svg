<svg xmlns="http://www.w3.org/2000/svg" width="930" height="230" viewBox="0 0 930 230" role="img" aria-labelledby="t"><title id="t">증거와 가설을 구분하기</title><rect width="930" height="230" fill="#122b31" rx="12"/><g font-family="sans-serif"><text x="24" y="35" font-size="18" fill="#a0e6c8">증거와 가설을 구분하기</text><path d="M298 117h30" stroke="#8bd7b6" stroke-width="2" fill="none"/><rect x="22" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="40" y="93" font-size="18" fill="#e6f0ec">관찰</text><text x="40" y="124" font-size="16" fill="#9be3c3">누가 · 언제 · 무엇을 봤나</text><text x="40" y="153" font-size="14" fill="#c4d9d1">오류 원문 · ID 보존</text><path d="M604 117h30" stroke="#8bd7b6" stroke-width="2" fill="none"/><rect x="328" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="346" y="93" font-size="18" fill="#e6f0ec">경계 확인</text><text x="346" y="124" font-size="16" fill="#9be3c3">어느 단계까지 성공했나</text><text x="346" y="153" font-size="14" fill="#c4d9d1">응답 생성 주체 확인</text><rect x="634" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="652" y="93" font-size="18" fill="#e6f0ec">가설 검증</text><text x="652" y="124" font-size="16" fill="#9be3c3">다음 검사가 무엇을 가르나</text><text x="652" y="153" font-size="14" fill="#c4d9d1">반증 가능한 조사 선택</text></g></svg>