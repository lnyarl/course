<svg xmlns="http://www.w3.org/2000/svg" width="930" height="230" viewBox="0 0 930 230" role="img" aria-labelledby="t"><title id="t">HTTP 의미와 전송 방식</title><rect width="930" height="230" fill="#122b31" rx="12"/><g font-family="sans-serif"><text x="24" y="35" font-size="18" fill="#a0e6c8">HTTP 의미와 전송 방식</text><path d="M298 117h30" stroke="#8bd7b6" stroke-width="2" fill="none"/><rect x="22" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="40" y="93" font-size="18" fill="#e6f0ec">HTTP/1.1</text><text x="40" y="124" font-size="16" fill="#9be3c3">텍스트 메시지 프레이밍</text><text x="40" y="153" font-size="14" fill="#c4d9d1">연결 재사용 가능</text><path d="M604 117h30" stroke="#8bd7b6" stroke-width="2" fill="none"/><rect x="328" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="346" y="93" font-size="18" fill="#e6f0ec">HTTP/2</text><text x="346" y="124" font-size="16" fill="#9be3c3">프레임 · 스트림 + TCP</text><text x="346" y="153" font-size="14" fill="#c4d9d1">TCP 순서 보장의 영향</text><rect x="634" y="65" width="276" height="110" rx="9" fill="#1d4247" stroke="#517a77"/><text x="652" y="93" font-size="18" fill="#e6f0ec">HTTP/3</text><text x="652" y="124" font-size="16" fill="#9be3c3">프레임 · 스트림 + QUIC</text><text x="652" y="153" font-size="14" fill="#c4d9d1">스트림별 전달 순서</text></g></svg>