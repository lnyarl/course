[package]
name = "myctr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
caps = "0.5"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
nix = { version = "0.29", features = ["process", "signal", "sched", "hostname", "fs", "user", "mount"] }
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }

